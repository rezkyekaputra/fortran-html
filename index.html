<!DOCTYPE html>
<html lang='ja'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>長岡花火・正三尺玉 (Nagaoka Shosan-Shakudama) 🎆</title>
  <link rel='stylesheet' href='fireworks.css?v=nagaoka_v1'>
</head>
<body>
  <div class='stage'>
    <div class='clouds'></div>

    <div class='overlay'>
      <h1>長岡花火 · 正三尺玉</h1>
      <p class='sub'>NAGAOKA SHOSAN-SHAKUDAMA · 36-INCH COLOSSAL KAMURO DOME</p>
      <div class='pill-tag' id='audioToggle'>
        <span id='audioIcon'>🔊</span>
        <span id='audioText'>Suara Meriam Guntur Nagaoka: AKTIF (Klik Layar)</span>
      </div>
    </div>

    <canvas id='hanabiCanvas' class='hanabi-canvas'></canvas>

    <div class='nagaoka-landscape'>
      <div class='city-expanse'></div>
      <div class='foreground-forest'></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hanabiCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Synthesizer: Suara Meriam Menggelegar Nagaoka
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBoomSound() {
      if (!soundEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(50, t);
      osc.frequency.exponentialRampToValueAtTime(16, t + 1.8);
      gain.gain.setValueAtTime(0.9, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 2.3);
    }

    const particles = [];
    let shellAscending = true;
    let rocketY = 0;
    let rocketTargetY = 0;
    let rocketX = 0;
    let rocketVy = -11;
    const rocketTrail = [];

    function launchNagaokaShell() {
      shellAscending = true;
      rocketX = canvas.width * 0.38; // Posisi kubah mirip foto di sebelah kiri tengah
      rocketY = canvas.height * 0.95;
      rocketTargetY = canvas.height * 0.38; // Ketinggian detonasi
      rocketVy = - (9.5 + Math.random() * 1.5);
      rocketTrail.length = 0;
    }

    class ShosanParticle {
      constructor(x, y, vx, vy, color, isKamuro, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.isKamuro = isKamuro;
        this.life = life;
        this.maxLife = life;
        this.trail = [];
        this.maxTrail = isKamuro ? 28 : 12;
        this.waveFreq = 0.15 + Math.random() * 0.1;
        this.waveAmp = isKamuro ? (0.6 + Math.random() * 0.8) : 0;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > this.maxTrail) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        if (this.isKamuro) {
          // Fisika Kubah Nagaoka: Hambatan horizontal tinggi sehingga jatuh lurus vertikal!
          this.vx *= 0.978; 
          this.vy *= 0.985;
          this.vy += 0.052; // Gravitasi menarik jatuh ke tanah
          // Efek Shimmer / Gelombang Sulur Braided ala Foto
          this.x += Math.sin(this.life * this.waveFreq) * this.waveAmp * 0.25;
        } else {
          this.vx *= 0.96;
          this.vy *= 0.96;
          this.vy += 0.03;
        }
        this.life--;
      }
      draw() {
        if (this.trail.length < 2) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.beginPath();
        ctx.moveTo(this.trail[0].x, this.trail[0].y);
        for (let i = 1; i < this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x, this.trail[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = this.isKamuro ? 1.4 : 2.5;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
    }

    function explodeNagaokaDome(cx, cy) {
      playBoomSound();

      // 1. KUBAH EMAS RAKSASA (KAMURO WILLOW DOME - 380 SULUR PERSIS FOTO)
      const domeCount = 380;
      for (let i = 0; i < domeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        // Kecepatan disesuaikan agar membentuk setengah bola kubah payung raksasa
        const speed = 2.0 + Math.random() * 5.2;
        // Vektor horizontal simetris & atas mengembang
        const vx = Math.cos(angle) * speed * 1.35;
        let vy = Math.sin(angle) * speed;
        if (vy > 0) vy *= 0.55; // Puncak atas lebih kubah (dome shape)
        const colors = ['#fff8db', '#fed330', '#f1c40f', '#e67e22', '#d35400'];
        const col = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new ShosanParticle(cx, cy, vx, vy, col, true, 160 + Math.random() * 50));
      }

      // 2. CINCIN BINTANG PELANGI DI INTI (RAINBOW PEONY CORE PERSIS FOTO)
      const rainbowColors = ['#00ff88', '#ff007f', '#00d2ff', '#fab1a0', '#ffeaa7', '#9b59b6'];
      const coreCount = 75;
      for (let i = 0; i < coreCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 2.8; // Terkonsentrasi di dalam inti
        const vx = Math.cos(angle) * speed * 1.2;
        const vy = Math.sin(angle) * speed * 1.2;
        const col = rainbowColors[i % rainbowColors.length];
        particles.push(new ShosanParticle(cx, cy, vx, vy, col, false, 75 + Math.random() * 25));
      }
    }

    function loop() {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'lighter';

      // Animasi Roket Menjulang Naik
      if (shellAscending) {
        rocketTrail.push({x: rocketX, y: rocketY});
        if (rocketTrail.length > 8) rocketTrail.shift();
        rocketY += rocketVy;
        rocketVy *= 0.985;
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3.5;
        for (let i = 0; i < rocketTrail.length; i++) {
          ctx.lineTo(rocketTrail[i].x, rocketTrail[i].y);
        }
        ctx.stroke();
        if (rocketY <= rocketTargetY || Math.abs(rocketVy) < 1.4) {
          shellAscending = false;
          explodeNagaokaDome(rocketX, rocketY);
        }
      }

      // Render & Update Partikel Kubah
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    launchNagaokaShell();
    setInterval(launchNagaokaShell, 6500);

    // Audio Toggle Listener
    const audioToggle = document.getElementById('audioToggle');
    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      document.getElementById('audioIcon').textContent = soundEnabled ? '🔊' : '🔇';
      document.getElementById('audioText').textContent = soundEnabled ? 'Suara Meriam Guntur Nagaoka: AKTIF' : 'Suara: NONAKTIF';
    });

    // Klik Layar = Ledakan Kubah Raksasa Seketika!
    window.addEventListener('click', (e) => {
      initAudio();
      explodeNagaokaDome(e.clientX, e.clientY);
    });

    loop();
  </script>
</body>
</html>
