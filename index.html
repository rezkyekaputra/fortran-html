<!DOCTYPE html>
<html lang='ja'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>長岡昼花火・正三尺玉 (Nagaoka Daytime Hanabi) ☀️🎆</title>
  <link rel='stylesheet' href='fireworks.css?v=daytime_v1'>
</head>
<body>
  <div class='stage'>
    <div class='daytime-clouds'></div>

    <div class='overlay'>
      <h1>長岡昼花火 · 正三尺玉</h1>
      <p class='sub'>NAGAOKA DAYTIME SHOSAN-SHAKUDAMA · AZURE SKY & SMOKE KAMURO</p>
      <div class='day-badge'>
        <span>☀️ Tema: Siang Hari (昼花火)</span>
        <span>·</span>
        <span>🔇 Suara: Nonaktif</span>
        <span>·</span>
        <span>✨ Otomatis Meluncur</span>
      </div>
    </div>

    <canvas id='hanabiCanvas' class='hanabi-canvas'></canvas>

    <div class='daytime-landscape'>
      <div class='city-expanse-day'></div>
      <div class='hills-foreground'></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hanabiCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    let shellAscending = true;
    let rocketY = 0;
    let rocketTargetY = 0;
    let rocketX = 0;
    let rocketVy = -11;
    const rocketTrail = [];

    function launchDaytimeShell() {
      shellAscending = true;
      rocketX = canvas.width * (0.35 + Math.random() * 0.15);
      rocketY = canvas.height * 0.95;
      rocketTargetY = canvas.height * 0.35;
      rocketVy = - (9.8 + Math.random() * 1.5);
      rocketTrail.length = 0;
    }

    class DaytimeParticle {
      constructor(x, y, vx, vy, color, isKamuro, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.isKamuro = isKamuro;
        this.life = life;
        this.maxLife = life;
        this.trail = [];
        this.maxTrail = isKamuro ? 26 : 12;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > this.maxTrail) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        if (this.isKamuro) {
          this.vx *= 0.978; 
          this.vy *= 0.985;
          this.vy += 0.052; // Tarikan gravitasi lurus ke bawah
        } else {
          this.vx *= 0.96;
          this.vy *= 0.96;
          this.vy += 0.035;
        }
        this.life--;
      }
      draw() {
        if (this.trail.length < 2) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.beginPath();
        ctx.moveTo(this.trail[0].x, this.trail[0].y);
        for (let i = 1; i < this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x, this.trail[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = alpha * 0.9;
        ctx.lineWidth = this.isKamuro ? 2.0 : 3.2;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
    }

    function explodeDaytimeDome(cx, cy) {
      // 1. KUBAH EMAS SIANG HARI (ORANYE TEMBAGA & EMAS TERANG KONTRAS LANGIT)
      const domeCount = 360;
      for (let i = 0; i < domeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.2 + Math.random() * 5.0;
        const vx = Math.cos(angle) * speed * 1.35;
        let vy = Math.sin(angle) * speed;
        if (vy > 0) vy *= 0.55;
        // Warna pigmen tebal agar kontras jelas di langit siang
        const dayColors = ['#d35400', '#e67e22', '#b71540', '#f39c12', '#c0392b'];
        const col = dayColors[Math.floor(Math.random() * dayColors.length)];
        particles.push(new DaytimeParticle(cx, cy, vx, vy, col, true, 160 + Math.random() * 50));
      }

      // 2. INTI BINTANG WARNA PEKAT SIANG HARI (MERAH, HIJAU, BIRU TUA, MAGENTA)
      const coreColors = ['#009432', '#ea2027', '#0652dd', '#8854d0', '#ff3838'];
      const coreCount = 80;
      for (let i = 0; i < coreCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.4 + Math.random() * 3.0;
        const vx = Math.cos(angle) * speed * 1.2;
        const vy = Math.sin(angle) * speed * 1.2;
        const col = coreColors[i % coreColors.length];
        particles.push(new DaytimeParticle(cx, cy, vx, vy, col, false, 80 + Math.random() * 25));
      }
    }

    function loop() {
      // Jejak Menghilang Halus di Latar Langit Siang Cerah
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Mode Gambar Standar (Source-Over) agar Warna Kontras Pekat di Siang Hari
      ctx.globalCompositeOperation = 'source-over';

      // Animasi Roket Asap Putih Menjulang Naik
      if (shellAscending) {
        rocketTrail.push({x: rocketX, y: rocketY});
        if (rocketTrail.length > 8) rocketTrail.shift();
        rocketY += rocketVy;
        rocketVy *= 0.985;
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4.0;
        for (let i = 0; i < rocketTrail.length; i++) {
          ctx.lineTo(rocketTrail[i].x, rocketTrail[i].y);
        }
        ctx.stroke();
        if (rocketY <= rocketTargetY || Math.abs(rocketVy) < 1.4) {
          shellAscending = false;
          explodeDaytimeDome(rocketX, rocketY);
        }
      }

      // Render & Update Partikel Kubah Siang
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    launchDaytimeShell();
    setInterval(launchDaytimeShell, 6500);

    loop();
  </script>
</body>
</html>
