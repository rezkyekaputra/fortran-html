<!DOCTYPE html>
<html lang='ja'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>錦冠菊 · 日本の花火 (Nishiki Kamuro Photorealistic) 🎆</title>
  <link rel='stylesheet' href='fireworks.css?v=photoreal_v1'>
</head>
<body>
  <div class='sky-ambient'></div>

  <div class='overlay'>
    <h1>錦冠菊 · 日本の花火</h1>
    <p class='sub'>NISHIKI KAMURO · PHOTOREALISTIC WEAKING WILLOW & JEWEL STREAMERS</p>
    <div class='meta'>
      <span>⚡ Physics: GNU Fortran 14.3.1</span>
      <span>·</span>
      <span>🎨 Style: Dart Sass 1.107.1</span>
      <span>·</span>
      <span>🔥 Additive Trail Physics</span>
    </div>
  </div>

  <canvas id='hanabiCanvas' class='hanabi-canvas'></canvas>

  <div class='city-silhouette'>
    <div class='bridge-glow'></div>
    <div class='bridge-glow-2'></div>
    <div class='city-lights'></div>
    <div class='river-reflection'></div>
  </div>

  <script>
    const canvas = document.getElementById('hanabiCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const rockets = [];

    class Rocket {
      constructor(x, targetY) {
        this.x = x;
        this.y = canvas.height;
        this.targetY = targetY;
        this.vy = - (12 + Math.random() * 3);
        this.trail = [];
        this.dead = false;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 8) this.trail.shift();
        this.y += this.vy;
        this.vy *= 0.985;
        if (this.y <= this.targetY || Math.abs(this.vy) < 1.5) {
          this.dead = true;
          explodeKamuro(this.x, this.y);
        }
      }
      draw() {
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        for (let i = 0; i < this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x, this.trail[i].y);
        }
        ctx.stroke();
      }
    }

    class Particle {
      constructor(x, y, vx, vy, color, isWillow, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.isWillow = isWillow;
        this.life = life;
        this.maxLife = life;
        this.trail = [];
        this.maxTrail = isWillow ? 18 : 12;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > this.maxTrail) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.982; // Hambatan udara
        this.vy *= 0.982;
        this.vy += this.isWillow ? 0.055 : 0.04; // Gravitasi fisika
        this.life--;
      }
      draw() {
        if (this.trail.length < 2) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.beginPath();
        ctx.moveTo(this.trail[0].x, this.trail[0].y);
        for (let i = 1; i < this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x, this.trail[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = this.isWillow ? 1.6 : 2.4;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
    }

    function explodeKamuro(x, y) {
      // 1. KANOPI EMAS KAMURO (280 partikel sulur weeping willow)
      const goldCount = 280;
      for (let i = 0; i < goldCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 5.8;
        const vx = Math.cos(angle) * speed * 1.35; // Sebaran horizontal lebar
        const vy = Math.sin(angle) * speed;
        const colors = ['#ffffff', '#ffeaa7', '#fed330', '#f39c12', '#e67e22'];
        const col = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, vx, vy, col, true, 110 + Math.random() * 40));
      }

      // 2. SULUR NEON JEPANG (Hijau, Magenta, Cyan, Oranye)
      const jewelColors = ['#00ff88', '#ff007f', '#00e5ff', '#ff8800'];
      const jewelCount = 48;
      for (let i = 0; i < jewelCount; i++) {
        const angle = (i / jewelCount) * Math.PI * 2;
        const speed = 6.2 + Math.random() * 2.5;
        const vx = Math.cos(angle) * speed * 1.3;
        const vy = Math.sin(angle) * speed * 0.9;
        const col = jewelColors[i % jewelColors.length];
        particles.push(new Particle(x, y, vx, vy, col, false, 85 + Math.random() * 25));
      }
    }

    function loop() {
      // Efek Long-Exposure Persistence (Jejak Api Bertahan)
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Additive Blending (Cahaya Api Bertumpuk Menjadi Putih Terang)
      ctx.globalCompositeOperation = 'lighter';

      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();
        if (rockets[i].dead) rockets.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    // Peluncuran Otomatis Bergantian ala Hanabi Festival
    function launchShell() {
      const x = canvas.width * (0.35 + Math.random() * 0.3);
      const targetY = canvas.height * (0.2 + Math.random() * 0.18);
      rockets.push(new Rocket(x, targetY));
    }

    launchShell();
    setInterval(launchShell, 3200);

    // Klik layar untuk meledakkan kembang api seketika di posisi kursor!
    window.addEventListener('click', (e) => {
      explodeKamuro(e.clientX, e.clientY);
    });

    loop();
  </script>
</body>
</html>
