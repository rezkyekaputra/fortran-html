<!DOCTYPE html>
<html lang='ja'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>長岡虹色昼花火・正三尺玉 (Nagaoka Rainbow Daytime Hanabi) 🌈🎆</title>
  <link rel='stylesheet' href='fireworks.css?v=rainbow_v1'>
</head>
<body>
  <div class='stage'>
    <div class='daytime-clouds'></div>

    <div class='overlay'>
      <h1>長岡虹色昼花火 · 正三尺玉</h1>
      <p class='sub'>NAGAOKA RAINBOW DAYTIME SHOSAN-SHAKUDAMA · 360° RAINBOW WATERFALL</p>
      <div class='rainbow-badge'>
        <span>🌈 Warna: Spektrum Pelangi Penuh</span>
        <span>·</span>
        <span>☀️ Siang Hari</span>
        <span>·</span>
        <span>🔇 Hening Tanpa Suara</span>
      </div>
    </div>

    <canvas id='hanabiCanvas' class='hanabi-canvas'></canvas>

    <div class='daytime-landscape'>
      <div class='city-expanse-day'></div>
      <div class='hills-foreground'></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hanabiCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Palet Warna Spektrum Pelangi 360 Derajat (High-Contrast Pigments)
    const rainbowPalette = [
      '#eb2f06', // Merah cerah
      '#e55039', // Oranye kemerahan
      '#fa983a', // Oranye segar
      '#f6b93b', // Kuning emas
      '#78e08f', // Hijau muda cerah
      '#38ada9', // Toska / Cyan
      '#00cec9', // Cyan elektrik
      '#0984e3', // Biru safir
      '#4a69bd', // Biru indigo
      '#6a89cc', // Nila / Lavender
      '#8854d0', // Ungu violet
      '#b71540'  // Magenta ruby
    ];

    const particles = [];
    let shellAscending = true;
    let rocketY = 0;
    let rocketTargetY = 0;
    let rocketX = 0;
    let rocketVy = -11;
    const rocketTrail = [];

    function launchRainbowShell() {
      shellAscending = true;
      rocketX = canvas.width * (0.35 + Math.random() * 0.15);
      rocketY = canvas.height * 0.95;
      rocketTargetY = canvas.height * 0.35;
      rocketVy = - (9.8 + Math.random() * 1.5);
      rocketTrail.length = 0;
    }

    class RainbowParticle {
      constructor(x, y, vx, vy, color, isKamuro, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.isKamuro = isKamuro;
        this.life = life;
        this.maxLife = life;
        this.trail = [];
        this.maxTrail = isKamuro ? 28 : 14;
      }
      update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > this.maxTrail) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        if (this.isKamuro) {
          this.vx *= 0.978; 
          this.vy *= 0.985;
          this.vy += 0.052; // Gravitasi menarik jatuh vertikal
        } else {
          this.vx *= 0.96;
          this.vy *= 0.96;
          this.vy += 0.035;
        }
        this.life--;
      }
      draw() {
        if (this.trail.length < 2) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.beginPath();
        ctx.moveTo(this.trail[0].x, this.trail[0].y);
        for (let i = 1; i < this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x, this.trail[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = alpha * 0.92;
        ctx.lineWidth = this.isKamuro ? 2.2 : 3.4;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
    }

    function explodeRainbowDome(cx, cy) {
      // 1. KUBAH PELANGI 360 DERAJAT (SUDUT DIPETAKAN KE SPEKTRUM WARNA)
      const domeCount = 380;
      for (let i = 0; i < domeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.2 + Math.random() * 5.2;
        const vx = Math.cos(angle) * speed * 1.35;
        let vy = Math.sin(angle) * speed;
        if (vy > 0) vy *= 0.55;
        // Pemetaan Sudut ke Warna Spektrum Pelangi Melingkar!
        const normalizedAngle = (angle + Math.PI) / (Math.PI * 2);
        const colorIdx = Math.floor(normalizedAngle * rainbowPalette.length) % rainbowPalette.length;
        const col = rainbowPalette[colorIdx];
        particles.push(new RainbowParticle(cx, cy, vx, vy, col, true, 160 + Math.random() * 50));
      }

      // 2. INTI BINTANG GEMERLAP PELANGI KONSENTRIS
      const coreCount = 90;
      for (let i = 0; i < coreCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 3.2;
        const vx = Math.cos(angle) * speed * 1.2;
        const vy = Math.sin(angle) * speed * 1.2;
        const col = rainbowPalette[i % rainbowPalette.length];
        particles.push(new RainbowParticle(cx, cy, vx, vy, col, false, 80 + Math.random() * 25));
      }
    }

    function loop() {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'source-over';

      // Roket Meluncur Naik
      if (shellAscending) {
        rocketTrail.push({x: rocketX, y: rocketY});
        if (rocketTrail.length > 8) rocketTrail.shift();
        rocketY += rocketVy;
        rocketVy *= 0.985;
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4.0;
        for (let i = 0; i < rocketTrail.length; i++) {
          ctx.lineTo(rocketTrail[i].x, rocketTrail[i].y);
        }
        ctx.stroke();
        if (rocketY <= rocketTargetY || Math.abs(rocketVy) < 1.4) {
          shellAscending = false;
          explodeRainbowDome(rocketX, rocketY);
        }
      }

      // Render & Update Partikel Kubah Pelangi
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    launchRainbowShell();
    setInterval(launchRainbowShell, 6500);

    loop();
  </script>
</body>
</html>
